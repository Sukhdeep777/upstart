<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="shortcut icon" href="../imagenes/icono.png" type="image/x-icon">
</head>
<body class="bg-gray-500 h-screen w-100% bg-gradient-to-br from-gray-400 to-[#20b3b3] font-['Franklin_Gothic_Medium','Arial_Narrow',Arial,sans-serif]">
    <header class=" flex w-full justify-around items-center border-b-[5px] border-[#20b3b3] bg-white">
        <div class="flex items-center">
            <div class="w-[90px] flex items-center">
                <img src="../imagenes/logo-upstart.png" alt="LOGO UPSTART" class="w-full">
            </div>
            <h1 class="text-[#20b3b3] text-[32px] font-bold pb-[8px]">UPSTART</h1>
        </div>
        <nav class="w-[60%] font-bold">
            <ul class="flex justify-around list-none m-0 p-0">
                <li class="hover:scale-110 transition-all duration-200">
                    <a href="../index.html" class="no-underline text-black px-[7px] py-[7px] rounded-[10px] hover:bg-[#469696] hover:text-white">INICIO</a>
                </li>
                <li class="hover:scale-110 transition-all duration-200">
                    <a href="upstart.html" class="no-underline text-black px-[7px] py-[7px] rounded-[10px] hover:bg-[#469696] hover:text-white">PUBLICA</a>
                </li>
                <li class="hover:scale-110 transition-all duration-200">
                    <a href="donaciones.html" class="no-underline text-black px-[7px] py-[7px] rounded-[10px] hover:bg-[#469696] hover:text-white">DONACIONES</a>
                </li>
                <li class="hover:scale-110 transition-all duration-200">
                    <a href="contacto.html" class="no-underline text-black px-[7px] py-[7px] rounded-[10px] hover:bg-[#469696] hover:text-white">CONTACTO</a>
                </li>
            </ul>
        </nav>
        <div class="lg ml-[10px]">
            <div class="border-2 border-[#20b3b3] rounded-[20px] hover:bg-[#20b3b3] transition-all duration-200">
                <a href="login.html" class="no-underline px-[25px] py-[13px] rounded-[20px] font-bold text-[#20b3b3] block hover:text-white">Log in</a>
            </div>
        </div>
        <div id="user-profile" class="hidden items-center gap-3 ml-[10px]" style="display:none;">
            <img id="user-avatar" src="" alt="Avatar" class="w-[42px] h-[42px] rounded-full border-2 border-[#20b3b3]">
            <button id="logoutButton" class="cursor-pointer border-2 border-[#20b3b3] text-[#20b3b3] font-bold px-[18px] py-[10px] rounded-[20px] hover:bg-[#20b3b3] hover:text-white transition-all duration-200">
                Salir
            </button>
        </div>
    </header>
<div class="flex justify-center items-center px-4 py-16">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
        
        <!-- Cabecera tarjeta -->
        <div class="bg-[#20b3b3] px-10 py-8">
            <p class="text-white text-3xl font-bold m-0">💙 Dona ahora</p>
            <p class="text-white/80 text-sm mt-1 m-0">Tu apoyo hace la diferencia</p>
        </div>

        <!-- Selector de cantidad rápida -->
        <div class="px-10 pt-8">
            <p class="text-gray-500 text-sm font-bold mb-3 m-0">CANTIDAD RÁPIDA</p>
            <div class="grid grid-cols-4 gap-2 mb-5">
                <button onclick="setAmount(5)" class=" border-2 border-[#20b3b3] text-[#20b3b3] font-bold py-2 rounded-xl hover:bg-[#20b3b3] hover:text-white transition duration-300 cursor-pointer bg-white">5€</button>
                <button onclick="setAmount(10)" class=" border-2 border-[#20b3b3] text-[#20b3b3] font-bold py-2 rounded-xl hover:bg-[#20b3b3] hover:text-white transition duration-300 cursor-pointer bg-white">10€</button>
                <button onclick="setAmount(25)" class=" border-2 border-[#20b3b3] text-[#20b3b3] font-bold py-2 rounded-xl hover:bg-[#20b3b3] hover:text-white transition duration-300 cursor-pointer bg-white">25€</button>
                <button onclick="setAmount(50)" class=" border-2 border-[#20b3b3] text-[#20b3b3] font-bold py-2 rounded-xl hover:bg-[#20b3b3] hover:text-white transition duration-300 cursor-pointer bg-white">50€</button>
            </div>

            <!-- Input cantidad personalizada -->
            <label class="text-gray-500 text-sm font-bold" for="cantidad">O INTRODUCE UNA CANTIDAD</label>
            <div class="flex items-center border-2 border-gray-200 rounded-xl mt-2 mb-5 focus-within:border-[#20b3b3] transition duration-300">
                <span class="text-gray-400 font-bold pl-4">€</span>
                <input 
                    id="cantidad" 
                    type="number" 
                    placeholder="0.00"
                    class="w-full bg-transparent px-3 py-3 outline-none text-gray-700 font-bold"
                >
            </div>

            <!-- Mensaje -->
            <label class="text-gray-500 text-sm font-bold" for="mensaje">MENSAJE (OPCIONAL)</label>
            <textarea 
                id="mensaje" 
                placeholder="Escribe un mensaje de apoyo..." 
                rows="3"
                class="w-full border-2 border-gray-200 rounded-xl mt-2 px-4 py-3 outline-none resize-none text-gray-700 focus:border-[#20b3b3] transition duration-300 bg-transparent"
            ></textarea>
        </div>

        <!-- Botón donar -->
        <div class="px-10 py-8">
            <button class="w-full bg-[#20b3b3] text-white font-bold py-4 rounded-xl text-lg hover:bg-[#469696] transition duration-500 cursor-pointer hover:scale-[1.02] shadow-lg shadow-[#20b3b3]/30">
                Donar ahora →
            </button>
            <p class="text-center text-gray-400 text-xs mt-4 m-0">🔒 Pago 100% seguro y cifrado</p>
        </div>
    </div>
</div>

    <script>
        function setAmount(val) {
            document.getElementById('cantidad').value = val;
        }
    </script>
    <script>
        // Dirección de la base de datos en Supabase (como la URL de una página web)
        const SUPABASE_URL = 'https://zvjxpexicorduvlsitfx.supabase.co';

        // Contraseña pública para poder conectarse a esa base de datos
        const SUPABASE_KEY = 'sb_publishable_1D-7xOkRDEmIER0b7CadvA_aOe9sbei';

        // Creamos la "conexión" con Supabase usando la URL y la KEY
        // _supabase es el objeto que usaremos para hacer consultas
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


        // --- FUNCIÓN: gestionarHeader ---
        // Decide si mostrar el botón "Log in" o el avatar del usuario en el header
        async function gestionarHeader() {

            // Le preguntamos a Supabase: "¿hay algún usuario con sesión iniciada?"
            // { data: { user } } extrae el usuario directamente de la respuesta
            const { data: { user } } = await _supabase.auth.getUser();

            // Buscamos en el HTML el div que contiene el botón "Log in" (tiene clase "lg")
            const loginContainer = document.querySelector('.lg');

            // Buscamos el div que contiene el avatar y el botón "Salir"
            const userProfile = document.getElementById('user-profile');

            // Buscamos la etiqueta <img> donde se mostrará la foto del usuario
            const userAvatar = document.getElementById('user-avatar');

            // Si existe un usuario con sesión activa...
            if (user) {
                // Ocultamos el botón "Log in"
                if (loginContainer) loginContainer.style.display = 'none';

                // Mostramos el div del perfil (avatar + botón Salir)
                userProfile.style.display = 'flex';

                // Generamos una imagen de avatar automática con las iniciales del email
                // ui-avatars.com crea una imagen personalizada al vuelo con la URL
                userAvatar.src = `https://ui-avatars.com/api/?name=${user.email}&background=00c9c9&color=fff`;

            } else {
                // Si NO hay sesión, mostramos el botón "Log in"
                if (loginContainer) loginContainer.style.display = 'block';

                // Y ocultamos el perfil
                userProfile.style.display = 'none';
            }
        }


        // --- EVENTO: clic en el botón "Enviar" del formulario de contacto ---
        document.getElementById('btnEnviar').addEventListener('click', async () => {

            // 1. Leemos el texto que el usuario escribió en cada campo del formulario
            const nombreInput = document.getElementById('nombre').value;
            const emailInput = document.getElementById('email').value;
            const mensajeInput = document.getElementById('mensaje').value;

            // 2. Comprobamos que ningún campo esté vacío
            // El operador ! significa "si esto NO tiene valor"
            if (!nombreInput || !emailInput || !mensajeInput) {
                alert("Por favor, completa todos los campos.");
                return; // Salimos de la función, no enviamos nada
            }

            // 3. Insertamos los datos en la tabla "contactos" de Supabase
            // .from('contactos') → selecciona la tabla
            // .insert([{...}])   → añade una nueva fila con esos datos
            const { data, error } = await _supabase
                .from('contactos')
                .insert([
                    { nombre: nombreInput, email: emailInput, mensaje: mensajeInput }
                ]);

            // 4. Si hubo un error, lo mostramos en consola y avisamos al usuario
            if (error) {
                console.error("Error al enviar el mensaje:", error);
                alert("Hubo un error al enviar tu mensaje. Inténtalo de nuevo.");
            } else {
                // Si fue bien, avisamos al usuario con un mensaje de éxito
                alert("¡Mensaje enviado con éxito!");

                // Limpiamos los campos del formulario dejándolos vacíos
                document.getElementById('nombre').value = '';
                document.getElementById('email').value = '';
                document.getElementById('mensaje').value = '';
            }
        });


        // --- EVENTO: clic en el botón "Salir" ---
        document.getElementById('logoutButton').addEventListener('click', async () => {

            // Le decimos a Supabase que cierre la sesión del usuario actual
            const { error } = await _supabase.auth.signOut();

            // Si hubo un error al cerrar sesión, lo mostramos en consola
            if (error) console.log("Error al salir:", error.message);

            // Recargamos la página para que el header se actualice (sin sesión)
            window.location.reload();
        });

        // Llamamos a la función al cargar la página para que el header esté correcto
        gestionarHeader();
    </script>
</body>
</html>
