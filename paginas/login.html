<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSTART</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="shortcut icon" href="../imagenes/icono.png" type="image/x-icon">
</head>
<body class="bg-gray-500 bg-gradient-to-br from-gray-400 to-[#20b3b3] flex items-center justify-center h-screen">
    <div class="flex-col items-center w-[600px] h-[540px] bg-gray-100 rounded-xl gap-8 flex">
        <div class=" w-[400px] text-center"><p class="text-6xl text-blue-400 mt-8 font-bold">Iniciar Sesión</p></div>
        <div class="mt-3 mb-2">
            <input id="email" class="bg-gray-300 hover:scale-105 transition duration-500 rounded-lg w-[500px] text-xl mt-10 mb-10 px-3 py-2 outline-none " type="text" placeholder="Escriba su correo...">
            <div class="flex">
                <input type="password" id="password" placeholder="Contraseña" class="bg-gray-300 hover:scale-105 transition duration-500 rounded-lg w-[500px] text-xl px-3 py-2 outline-none">
            </div>
            <div class="text-end mt-1">
                <p class="inline-block"><a href="#">¿Olvidaste tu contraseña?</a></p>
            </div>            
        </div>
        <div class="flex justify-center">
            <button id="loginButton" class="hover:bg-blue-400 hover:scale-110 transition duration-500 cursor-pointer justify-center bg-[#00c9c9] w-[200px] h-[50px] rounded-xl text-xl mt-5">Iniciar sesión</button>
        </div>
        <div class="mt-1">
            <p>No tienes una cuenta? <a href="login2.html" class="text-blue-500 underline">Registrarse</a></p>
        </div>
    </div>
    <script>
        // ── 1. CONEXIÓN CON SUPABASE ──────────────────────────────────────────────────

        // Guardamos la dirección (URL) de nuestra base de datos en Supabase
        const SUPABASE_URL = 'https://zvjxpexicorduvlsitfx.supabase.co'

        // Guardamos la clave pública que nos da permiso para usar Supabase
        const SUPABASE_KEY = 'sb_publishable_1D-7xOkRDEmIER0b7CadvA_aOe9sbei'

        // Extraemos la función "createClient" del objeto global "supabase"
        // Esto se llama DESESTRUCTURACIÓN: en vez de escribir supabase.createClient() cada vez,
        // guardamos esa función en su propia variable para usarla más cómodamente
        const { createClient } = supabase;

        // Creamos la conexión real con Supabase usando la URL y la KEY
        // _supabase será el objeto que usemos para todo: login, consultas, etc.
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);


        // ── 2. FUNCIÓN DE LOGIN ───────────────────────────────────────────────────────

        // Buscamos el botón "Iniciar sesión" en el HTML por su id y lo guardamos
        const loginButton = document.querySelector("#loginButton");

        // Añadimos un "escuchador": cuando el usuario haga clic en el botón, se ejecuta esta función
        // "async" significa que dentro podremos usar "await" para esperar respuestas de Supabase
        loginButton.addEventListener('click', async () => {

            // Leemos lo que el usuario escribió en el campo email
            const email = document.querySelector('#email').value;

            // Leemos lo que el usuario escribió en el campo contraseña
            const pass = document.querySelector('#password').value;

            // Le pedimos a Supabase que intente iniciar sesión con ese email y contraseña
            // "signInWithPassword" es el método de Supabase para el login clásico (email + pass)
            // "await" hace que el programa ESPERE aquí hasta tener respuesta de Supabase
            // El resultado se divide en dos partes: "data" (los datos si fue bien) y "error" (si falló)
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,       // el email que introdujo el usuario
                password: pass,     // la contraseña que introdujo el usuario
            });

            // Si Supabase devolvió un error (email incorrecto, contraseña incorrecta, etc.)
            if (error) {
                // Mostramos el mensaje de error en una ventana emergente
                // error.message es el texto descriptivo del error que nos da Supabase
                alert("Error al entrar: " + error.message);

            } else {
                // Si no hay error, el login fue exitoso
                alert("¡Bienvenido de nuevo!");

                // Redirigimos al usuario a la página principal de la app
                // window.location.href cambia la URL actual, como si pulsaras un enlace
                window.location.href = "../index.html";
            }
        });

    </script>
</body>
</html>
